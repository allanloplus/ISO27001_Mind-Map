<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISO 27001 標準簡介</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --page:#E9EEF1; --ink:#12303A; --muted:#5B7079; --line:#D5DEE3;
  --navy:#0E2A47; --navy2:#1C4470; --blue:#1565C0; --blue-soft:#D4ECF9;
  --red:#EC5A53; --red-soft:#FDE9E7; --purple:#A24DBA; --new:#B7771F; --new-soft:#F7EAD2;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--sans);padding-inline:16px;padding-block:16px 28px;margin:0}
.player{max-width:1280px;margin:0 auto;display:grid;gap:10px}
#viewport{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:10px;background:#F6F9FA;box-shadow:0 1px 2px rgba(14,42,71,.08),0 10px 30px rgba(14,42,71,.12)}
#viewport:fullscreen{border-radius:0;background:#0B1F35;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;cursor:pointer;
  background:#F6F9FA radial-gradient(circle,#D9E3E8 1.2px,transparent 1.3px) 0 0/26px 26px}
/* header: course + lecturer on every frame */
#hdr{position:absolute;left:0;top:0;right:0;height:92px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:28px;padding:0 34px;z-index:5}
#hdr .course{display:grid;line-height:1.15}
#hdr .lbl{font-size:14px;letter-spacing:.14em;color:#9DB7D2}
#hdr .course b{font-size:34px;font-weight:900;letter-spacing:.03em}
#hdr .sec{margin-left:auto;margin-right:auto;font-size:19px;background:var(--navy2);border-radius:999px;padding:7px 20px;white-space:nowrap;max-width:560px;overflow:hidden;text-overflow:ellipsis}
#hdr .lect{display:grid;justify-items:end;line-height:1.15}
#hdr .lect b{font-size:32px;font-weight:900;color:#FFB2A6;letter-spacing:.04em}
#hdr .lect small{font-size:13px;color:#9DB7D2}
/* caption (replaces narration) */
#cap{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 34px 0 318px;z-index:5}
#cap .no{position:absolute;right:18px;bottom:6px;font-family:var(--mono);font-size:13px;color:var(--muted)}
#cap .who{flex:none;font-size:15px;font-weight:700;color:#fff;border-radius:999px;padding:3px 12px;background:var(--navy)}
#cap .who.R{background:#E0528A}
#cap p{margin:0;font-size:25px;font-weight:500;line-height:1.4;text-wrap:balance}
/* presenters */
.av{position:absolute;z-index:6;transition:transform .5s cubic-bezier(.3,1.45,.5,1)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block;background:#fff;box-shadow:0 0 0 3px #fff,0 6px 18px rgba(14,42,71,.28)}
.av span{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:2px 10px}
.av::before{content:"";position:absolute;inset:-6px;border-radius:16px;border:3px solid #FFB2A6;opacity:0}
.av.talk::before{animation:ring 1.1s ease-out infinite}
#allan{left:22px;bottom:12px;width:130px;height:200px}
#allan.talk img{animation:talk .9s ease-in-out infinite}
#arale{left:168px;bottom:12px;width:124px;height:144px;transform:translateY(190px) rotate(-12deg)}
#arale.show{transform:none}
#arale span{background:#E0528A}
#arale::before{border-color:#F7A3C4}
#arale.talk img{animation:hop .45s ease-in-out infinite alternate}
@keyframes talk{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-4px) rotate(-1deg)}70%{transform:translateY(-1px) rotate(.8deg)}}
@keyframes hop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-9px) rotate(4deg)}}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.1)}}
#startbtn{position:absolute;left:50%;top:694px;transform:translateX(-50%);z-index:7;font:inherit;font-size:24px;font-weight:700;color:#fff;background:var(--navy);border:0;border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 8px 24px rgba(14,42,71,.3)}
#startbtn:hover{background:var(--navy2)}
#startbtn:focus-visible{outline:3px solid #FFB2A6;outline-offset:3px}
/* supplementary card */
#card{position:absolute;right:26px;top:110px;width:528px;max-height:692px;overflow:hidden;background:#fff;border-radius:14px;padding:24px 28px 26px;z-index:4;
  box-shadow:0 2px 4px rgba(14,42,71,.06),0 16px 40px rgba(14,42,71,.14);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#card.off{opacity:0;transform:translateX(40px)}
#card.center{right:auto;left:50%;top:50%;width:980px;max-height:none;transform:translate(-50%,-46%);padding:40px 48px}
#card.center.off{transform:translate(-50%,-40%)}
.eb{font-family:var(--mono);font-size:14px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
.red .eb{color:var(--red)}
#card h2{font-size:30px;font-weight:900;margin:4px 0 12px;line-height:1.25;text-wrap:balance}
#card .body{font-size:18px;line-height:1.62}
#card ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
#card p{margin:8px 0 0}
#card code{font-family:var(--mono);font-size:.9em;color:var(--blue);font-weight:600}
.red #card code,#card.red code{color:var(--red)}
.note{margin-top:12px;background:#F1F6F8;border-radius:8px;padding:9px 13px;font-size:16px;color:#34505B}
.new{display:inline-block;font-size:12.5px;font-weight:700;color:var(--new);background:var(--new-soft);border-radius:4px;padding:0 6px;margin:0 3px;vertical-align:2px}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:0}
.flow li{position:relative;padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.flow li+li{margin-top:18px}
.flow li+li::before{content:"";position:absolute;left:24px;top:-16px;height:14px;border-left:2px solid var(--muted)}
.flow li+li::after{content:"";position:absolute;left:20px;top:-7px;border:5px solid transparent;border-top-color:var(--muted)}
.flow.dense li{padding:4px 12px}
.flow.dense li+li{margin-top:14px}
.flow.dense li+li::before{top:-13px;height:11px}
.flow.dense li+li::after{top:-6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv dt{font-weight:700;white-space:nowrap}
.kv dd{margin:0}
.pd{display:grid;grid-template-columns:44px 88px 1fr;gap:6px 10px;align-items:center}
.pd b{font-family:var(--mono);font-size:20px;color:#fff;background:var(--blue);border-radius:6px;text-align:center}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.nums div{background:var(--blue-soft);border-radius:8px;padding:8px 10px;line-height:1.2}
.nums b{display:block;font-family:var(--mono);font-size:34px;color:var(--blue)}
.caps2{columns:2;column-gap:18px;font-size:16px;line-height:1.7}
.caps2 span{font-family:var(--mono);color:var(--red);margin-right:6px}
/* title card */
.tt .eb{font-size:16px}
.tt h1{font-size:64px;font-weight:900;margin:6px 0 4px;letter-spacing:.02em;line-height:1.15}
.tt .sub{font-size:22px;color:var(--muted);margin:0 0 26px}
.tt .who{display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:start;border-top:1px solid var(--line);padding-top:22px}
.tt .who .nm{grid-row:span 2}
.tt .who .nm small{display:block;font-size:15px;color:var(--muted);letter-spacing:.14em}
.tt .who .nm b{font-size:44px;font-weight:900;color:var(--red);line-height:1.2}
.tt .who ul{font-size:17px;color:#34505B;gap:4px}
/* mind map */
#map{position:absolute;inset:0;width:1600px;height:900px}
.lk{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .8s ease,opacity .3s}
.lk.on{stroke-dashoffset:0;opacity:1}
.lk.dash{stroke-dasharray:10 9;stroke-dashoffset:0;opacity:0;transition:opacity .7s}
.lk.dash.on{opacity:1}
.nd{opacity:0;transform:scale(.55);transform-box:fill-box;transform-origin:center;transition:opacity .5s,transform .55s cubic-bezier(.2,.9,.25,1.25)}
.nd.on{opacity:1;transform:none}
.nd.on.dim,.lk.on.dim{opacity:.28}
.nd text{font-family:var(--sans)}
.nd .id{font-family:var(--mono);font-weight:600}
.nd.hl .box{fill:var(--hl)}
.nd.hl .ul{stroke-width:5}
.nd.hl text{font-weight:700}
@media (prefers-reduced-motion:reduce){.nd,.lk,#card,.av{transition-duration:.01s!important}.av img,.av::before{animation:none!important}}
.kiosk body{padding:0}.kiosk .player{max-width:none;gap:0}.kiosk .ctrl,.kiosk .legend{display:none}.kiosk #viewport{border-radius:0;box-shadow:none;height:100vh;aspect-ratio:auto}.kiosk #stage{cursor:default}
/* controls */
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctrl button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.ctrl button:hover{border-color:var(--blue)}
.ctrl button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ctrl #play{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700;min-width:92px}
.time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#bar{position:relative;flex:1;min-width:160px;height:22px;cursor:pointer}
#bar .trk{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--navy)}
#bar .tick{position:absolute;top:5px;width:2px;height:12px;border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
</style>
</head>

const TIMING = [{"dur":14.56,"lines":[{"who":"A","text":"大家好，我是羅宇倫 Allan。今天用一張心智圖，帶大家在五分鐘內看懂 ISO 27001。","start":1.0,"end":10.23},{"who":"R","text":"我是助教阿拉蕾！大家一起加油～","start":10.53,"end":13.96}]},{"dur":14.22,"lines":[{"who":"A","text":"這張心智圖以 ISO 27001 二〇二二年版為核心：上面是本文，右邊是附錄 A，再用虛線連到從流程角度重組的運作能力。","start":0.5,"end":13.62}]},{"dur":11.26,"lines":[{"who":"A","text":"本文有零到十章。第四到十章是驗證一定要做的要求，依照規劃、支援、執行、檢查、行動的循環來運轉。","start":0.5,"end":10.66}]},{"dur":11.95,"lines":[{"who":"A","text":"第四章組織全景：先找出內外部議題和關注方的要求，新版還要決定哪些要求由資訊安全管理系統來因應，再界定範圍。","start":0.5,"end":11.35}]},{"dur":12.24,"lines":[{"who":"A","text":"第五章領導作為：最高管理階層要訂政策、給資源、指派角色與權責。","start":0.5,"end":7.53},{"who":"R","text":"所以資訊安全，不只是資訊部門的事喔！","start":7.83,"end":11.64}]},{"dur":16.69,"lines":[{"who":"A","text":"第六章規劃，是整個標準的核心。先建立風險準則，識別、分析、評估風險，再選擇處理方式、比對附錄 A，產出適用性聲明，並訂定可量測的資安目標。","start":0.5,"end":16.09}]},{"dur":7.34,"lines":[{"who":"A","text":"第七章支援：包括資源、能力、認知、溝通，以及文件化資訊的管理。","start":0.5,"end":6.74}]},{"dur":7.79,"lines":[{"who":"A","text":"第八章運作：把第六章的風險評鑑與風險處理計畫確實執行，並留下紀錄。","start":0.5,"end":7.19}]},{"dur":9.77,"lines":[{"who":"A","text":"第九章績效評估：透過監視量測、內部稽核和管理審查，確認管理系統是否有效。","start":0.5,"end":9.17}]},{"dur":11.72,"lines":[{"who":"A","text":"第十章改善：發生不符合時，先矯正，再找出根因，採取矯正措施。","start":0.5,"end":7.56},{"who":"R","text":"先滅火，再防止火災再發生！","start":7.86,"end":11.12}]},{"dur":13.79,"lines":[{"who":"A","text":"附錄 A 共有四個主題、九十三項控制：組織三十七項、人員八項、實體十四項、技術三十四項。","start":0.5,"end":10.82},{"who":"R","text":"哇～九十三項，好多喔！","start":11.12,"end":13.19}]},{"dur":9.15,"lines":[{"who":"A","text":"A.5 組織控制最多，從政策、資產、存取、供應商，到資安事件、營運持續與遵循。","start":0.5,"end":8.55}]},{"dur":7.1,"lines":[{"who":"A","text":"A.6 人員控制，照著聘用前、聘用中、解聘後來安排。","start":0.5,"end":6.5}]},{"dur":5.83,"lines":[{"who":"A","text":"A.7 實體控制，分成安全區域與設備兩大類。","start":0.5,"end":5.23}]},{"dur":8.25,"lines":[{"who":"A","text":"A.8 技術控制有三十四項，新版新增的十一項控制，有七項在這裡。","start":0.5,"end":7.65}]},{"dur":12.47,"lines":[{"who":"A","text":"ISO 27002 為每一項控制加上五種屬性。其中「運作能力」，讓我們從流程面，重新串起這九十三項控制。","start":0.5,"end":11.87}]},{"dur":10.45,"lines":[{"who":"R","text":"阿拉蕾來數數看，一共有十五項運作能力！","start":0.5,"end":4.6},{"who":"A","text":"沒錯，節點旁的數字，就是對應的控制數量。","start":4.9,"end":9.85}]},{"dur":8.19,"lines":[{"who":"A","text":"治理：由高階核准政策，定義角色與職務區隔，並要求人員遵循。","start":0.5,"end":7.59}]},{"dur":8.02,"lines":[{"who":"A","text":"人資安全：從聘用前的背景調查，到教育訓練，再到離職後的責任。","start":0.5,"end":7.42}]},{"dur":7.86,"lines":[{"who":"A","text":"資訊保護：沿著分級、標示、使用、傳送、儲存到刪除，一路保護資訊。","start":0.5,"end":7.26}]},{"dur":7.48,"lines":[{"who":"A","text":"資產管理：從資產清冊開始，管到場所內外、歸還與汰除。","start":0.5,"end":6.88}]},{"dur":8.02,"lines":[{"who":"A","text":"存取管理：依業務需求訂規則，管好身分、鑑別資訊與存取權限。","start":0.5,"end":7.42}]},{"dur":8.39,"lines":[{"who":"A","text":"保全組態：以組態管理為中心，管住軟體安裝、特權工具與密碼技術。","start":0.5,"end":7.79}]},{"dur":7.66,"lines":[{"who":"A","text":"實體安全：由外而內守住安全區域，再管好設備的整個生命週期。","start":0.5,"end":7.06}]},{"dur":9.44,"lines":[{"who":"A","text":"威脅與弱點管理：把威脅情資和技術脆弱性管理串成循環。","start":0.5,"end":6.32},{"who":"R","text":"知己知彼，百戰百勝！","start":6.62,"end":8.84}]},{"dur":7.99,"lines":[{"who":"A","text":"應用程式安全：把安全融入需求、架構、程式、測試到上線的每一步。","start":0.5,"end":7.39}]},{"dur":7.36,"lines":[{"who":"A","text":"系統與網路安全：從組態、網路服務、區隔到網頁過濾，層層防護。","start":0.5,"end":6.76}]},{"dur":7.63,"lines":[{"who":"A","text":"供應者關係安全：從協議、供應鏈到雲端服務，管好外部風險。","start":0.5,"end":7.03}]},{"dur":9.99,"lines":[{"who":"A","text":"資安事件管理：準備、通報、評鑑、回應、學習，並保存證據。","start":0.5,"end":5.93},{"who":"R","text":"發現可疑事件，要馬上通報喔！","start":6.23,"end":9.39}]},{"dur":8.42,"lines":[{"who":"A","text":"持續性：以復原時間目標為起點，確保中斷時，資安與資訊服務仍然可用。","start":0.5,"end":7.82}]},{"dur":8.96,"lines":[{"who":"A","text":"資訊安全保證：透過遵循性審查、獨立審查與安全測試，證明控制有效。","start":0.5,"end":8.36}]},{"dur":7.57,"lines":[{"who":"A","text":"遵循性：識別法規與契約要求，保護智慧財產、紀錄與個資。","start":0.5,"end":6.97}]},{"dur":14.98,"lines":[{"who":"A","text":"總結一下：本文告訴我們管理系統怎麼運轉，附錄 A 提供控制措施，運作能力把它們串成可落地的流程。謝謝大家！","start":0.5,"end":11.66},{"who":"R","text":"謝謝大家，我們下次見～","start":11.96,"end":14.38}]}];

function box(n){ // world bbox
  if(n.type==='circle') return {x:n.x-n.r,y:n.y-n.r,w:2*n.r,h:2*n.r};
  if(n.type==='root'||n.type==='branch') return {x:n.x-n.w/2,y:n.y-n.h/2,w:n.w,h:n.h};
  let x=n.x,w=n.w; if(n.badge!=null){ if(n.bside>0) w+=44; else {x-=44;w+=44} }
  return {x,y:n.y-n.h/2,w,h:n.h};
}
function attach(n,tx,ty){
  if(n.type==='circle'){const dx=tx-n.x,dy=ty-n.y,d=Math.hypot(dx,dy)||1;return [n.x+dx/d*n.r,n.y+dy/d*n.r]}

    if(Math.abs(tx-n.x)>n.w/2+10) return [n.x+Math.sign(tx-n.x)*n.w/2,n.y];
    return [n.x,n.y+Math.sign(ty-n.y)*n.h/2];
  }
  const uy = n.type==='cap'? n.y : n.y+n.h/2-2;

  return tx < (left+right)/2 ? [left,uy] : [right,uy];
}
function pathD(a,b){

  const [x1,y1]=attach(A,bc[0],bc[1]);
  const [x2,y2]=attach(B,x1,y1);
  const dx=x2-x1, dy=y2-y1;
  if(Math.abs(dy)>Math.abs(dx)*1.6) return `M${x1},${y1} C${x1},${y1+dy*.55} ${x2},${y2-dy*.55} ${x2},${y2}`;
  return `M${x1},${y1} C${x1+dx*.55},${y1} ${x2-dx*.55},${y2} ${x2},${y2}`;
}

let starts=[],TOTAL=0;

function stateOf(k){

  const leaves=[];
  if(S[k].expand) for(const id in N) if(N[id].parent===S[k].expand){vis.add(id);leaves.push(id)}
  let focus = S[k].focus==='ALL' ? [...vis] : (S[k].focus || (S[k].expand?[S[k].expand,...leaves]:[...vis]));
  const hl=new Set(S[k].hl||[]); if(S[k].expand) hl.add(S[k].expand);
  const dim=S[k].expand ? new Set([...vis].filter(id=>id!==S[k].expand && N[id].parent!==S[k].expand)) : new Set();
  return {vis,focus,hl,dim};
}
let prevVis=new Set();

  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  ids.forEach(id=>{const b=box(N[id]);x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w);y2=Math.max(y2,b.y+b.h)});
  const pad=40; x1-=pad;y1-=pad;x2+=pad;y2+=pad;
  const R = s.card.pos==='center' ? {x:40,y:100,w:1520,h:640} : {x:30,y:104,w:1000,h:672};
  const sc=Math.min(R.w/(x2-x1),R.h/(y2-y1),1.3);

/* camera */
let cam={s:.3,cx:1500,cy:900,rx:800,ry:460}, camFrom=null, camTarget=null, camT0=0;
const CAMDUR=1500;
function camTo(s,cx,cy,R){camFrom={...cam};camTarget={s,cx,cy,rx:R.x+R.w/2,ry:R.y+R.h/2};camT0=performance.now()}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function camStep(now){
  if(camTarget){
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    let p=reduce?1:Math.min(1,(now-camT0)/CAMDUR); const e=ease(p);
    cam.s=Math.exp(Math.log(camFrom.s)+(Math.log(camTarget.s)-Math.log(camFrom.s))*e);
    for(const k of ['cx','cy','rx','ry']) cam[k]=camFrom[k]+(camTarget[k]-camFrom[k])*e;
    if(p>=1) camTarget=null;
  }
  document.getElementById('cam').setAttribute('transform',`translate(${cam.rx-cam.s*cam.cx},${cam.ry-cam.s*cam.cy}) scale(${cam.s})`);
}

  let i=0; L.forEach((l,j)=>{ if(tl>=l.start-0.05) i=j });
  const l=L[i], speaking=playing && tl>=l.start && tl<=l.end+0.1, key=cur+':'+i;
  if(force||key!==lineUI.k){ lineUI.k=key; $('who').textContent=l.who==='R'?'助教 阿拉蕾':'Allan 老師'; $('who').className='who '+l.who; $('captext').textContent=l.text }
  $('allan').classList.toggle('talk', speaking && l.who==='A');
  const rs=L.filter(x=>x.who==='R');
  const show = cur===0 || rs.some(x=>tl>=x.start-0.8 && tl<=x.end+1.2);
  $('arale').classList.toggle('show', show);
  $('arale').classList.toggle('talk', speaking && l.who==='R');
}
function ui(){$('fill').style.width=(t/TOTAL*100)+'%';$('time').textContent=`${fmt(t)} / ${fmt(TOTAL)}`;$('play').textContent=playing?'❚❚ 暫停':'▶ 播放'}
function setPlay(p){
  playing=p; if(p && t>=TOTAL-0.05) seek(0);
  if(p) $('startbtn').hidden=true;
  if(withAudio()){ if(p){ try{vo.currentTime=t}catch(e){} vo.play().catch(()=>{}) } else vo.pause() }
  lineUI(); ui()
}
function tick(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(playing){
    if(withAudio() && !vo.paused && vo.readyState>=2 && Math.abs(vo.currentTime-t)<1.5) t=vo.currentTime; else t+=dt;
    t=Math.min(TOTAL,t); if(t>=TOTAL){ setPlay(false) }
    const k=sceneAt(t); if(k!==cur){cur=k;apply(k)} lineUI(); ui()}
  camStep(now); requestAnimationFrame(tick);
}
function ticks(){
  const bar=$('bar'); bar.querySelectorAll('.tick').forEach(e=>e.remove());
  S.forEach((s,i)=>{const d=document.createElement('div');d.className='tick';d.style.left=`calc(${starts[i]/TOTAL*100}% - 1px)`;
    d.style.background=s.red?'#EC5A53':(s.sec.startsWith('附錄')?'#5C8FD6':'#1565C0');d.title=s.sec;bar.appendChild(d)});
}
function fit(){
  const vp=$('viewport'), k=Math.min(vp.clientWidth/1600, vp.clientHeight/900);
  const st=$('stage'); st.style.transform=`scale(${k})`;
  st.style.left=((vp.clientWidth-1600*k)/2)+'px'; st.style.top=((vp.clientHeight-900*k)/2)+'px';
}
$('play').onclick=()=>setPlay(!playing);
$('stage').onclick=e=>{ if(!e.target.closest('a,button')) setPlay(!playing) };
$('startbtn').onclick=()=>setPlay(true);
$('mute').onclick=()=>{vo.muted=!vo.muted;$('mute').textContent=vo.muted?'聲音：關':'聲音：開'};
$('prev').onclick=()=>seek(cur-1);
$('next').onclick=()=>seek(cur+1);
$('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seekTime((e.clientX-r.left)/r.width*TOTAL)};
$('fs').onclick=()=>{const vp=$('viewport'); if(document.fullscreenElement) document.exitFullscreen(); else vp.requestFullscreen?.().catch(()=>{})};
document.addEventListener('fullscreenchange',()=>setTimeout(fit,50));
addEventListener('resize',fit);
document.addEventListener('keydown',e=>{
  if(e.target.closest('button')&&e.key===' ') return;
  if(e.key===' '){e.preventDefault();setPlay(!playing)}
  else if(e.key==='ArrowRight') seek(cur+1);
  else if(e.key==='ArrowLeft') seek(cur-1);
  else if(e.key==='f'||e.key==='F') $('fs').click();
});
function start(){
  build(); render(); timeline(); ticks(); fit();
  const q = new URLSearchParams(location.search);
  if(q.has('kiosk')){ kiosk=true; document.documentElement.classList.add('kiosk'); $('startbtn').hidden=true }
  fit(); seek(0); seekTime.ready=true;
  requestAnimationFrame(tick);
  if(kiosk && !q.has('paused')) setTimeout(()=>setPlay(true),1200);
}
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]) : Promise.resolve()).then(start);
</script>
